l_english:
 mollissea_sec_1.1.t:0 "The Mollissea Security Agency coups The Mollissean Government!"
 mollissea_sec_1.1.d:0 "Thousands of soilders went into the Mollissea capitol today in a attempt to coup the Mollissean government they deemed as corrupt and elections have been currently suspended. We will see where this new government leads."
 mollissea_sec_1.1.a:0 "For a Secure Mollissea!"
 mollissea_torch.1.t:0 "Presidental election results"
 mollissea_torch.1.d:0 "A new election means a new Mollissea so now lets see for whom the winner may be..."
 mollissea_torch.1.a:0 "Squidd Triumphent!"
 mollissea_misc.1.t:0 "Where do we go next?"
 mollissea_misc.1.d:0 "Mollissea has a choice on where to go next with this TPC coup but the question is where do we go next?"
 mollissea_misc.1.a:0 "The Council will Lead!"
 mollissea_misc.1.b:0 "The MSA will ensure Mollissea's security."
 mollissea_misc.1.c:0 "The Presidental Road"
 mollissea_torch.1.b:0 "Desmon Triumphent!"
 mollissea_torch.1.c:0 "Search for other canidates"
 mollissea_torch.2.t:0 "The Last Canidate..."
 mollissea_torch.2.d:0 "the other two canidates for president left the election in a sort of deadlock neither side could really get anywhere so we have one last choice..."
 mollissea_torch.2.a:0 "Convince Torch"
 mollissea_torch.3.t:0 "Torch a leader once more?"
 mollissea_torch.3.d:0 "Torch seeing the current situation they recluctently agree to be the new president of Mollissea!"
 mollissea_torch.3.a:0 "A new, free, future!"
 mollissea_squidd.1.a:0 "For a progressive Mollissea!"
 mollissea_squidd.1.t:0 "A Triumphent Squidd"
 mollissea_squidd.1.d:0 "Squidd as a person has not been in the public eye for long always making friends many in high places and she has been known for her research such in the field of weapons..."
 mollissea_desmon.1.t:0 "Desmon decleared victor!"
 mollissea_desmon.1.d:0 "Desmon in Mollissea history has been an interesting one he founded the nation and lost to the now couped Noava he worked and help establish the TPC and got the authotarian Noava out of power whilst he wishes to keep Mollissea democratic he often works with others who influcnce him such as Squidd..."
 mollissea_squidd.2.t:0 "What to do with the Fists of Fur?"
 mollissea_squidd.2.d:0 "Fists of Fur and we now share a leader: Squidd what should be their fate now?"
 mollissea_squidd.2.a:0 "Puppet Them"
 mollissea_squidd.2.b:0 "Annex Them"
 mollissea_squidd.3.t:0 "Autonomy"
 mollissea_squidd.3.d:0 "For some reason the autonomy of fists of fur would not be set to personal union if I did not make this god forsaken event."
 mollissea_squidd.3.a:0 "I both love and hate this game."
 fists_of_fur.1.t:0 "Puppet"
 fists_of_fur.1.d:0 "wha why are you seeing this get out of here"
 mollissea_desmon.2.t:0 "Pulled Apart"
 mollissea_desmon.2.d:0 "Mollissea is pulled apart day by day by the corporations, The M.S.A., and other outside actors Mollissea and its leader can not take this much longer for if she does nothing good would come."
 mollissea_desmon.2.a:0 "I hope for at least a future."
 mollissea_torch.4.t:0 "Torchiceo wins the Mollissean Elections"
 mollissea_torch.4.d:0 "Interesting news out of Mollissea today as it is announced as the interm president Torchiceo also known simply as Torch managed to win the Mollissean elections. With the two other canidates held in a deadlock in terms of negoations and votes Torchiceo who entered as a "Unity Figure" in Mollissean Politics won in a landslide this shows hope for Mollissea after its last president Noava ruled with an iron fist."
 mollissea_torch.4.a:0 "For a Free Mollissea!"
 mollissea_torch.2.b:0 "The other two were less of a hassle..."
 mollissea_misc.2.t:0 "The Current Situation"
 mollissea_misc.2.d:0 "Mr. President the current regional situation is as follows: Mollissea - Us, a country formed out of the pacific states in the wake of the collapse of the American Exprement  Mountain Centeral Republic - A Libertarian nation formed within the former American Mid-West a small government so much it might as well be anarchy. Fists of Fur - A Despotic nation formed in the Eastern American Mid-West they keep themselves calm and quiet in global affairs almost too quiet... The American Unity Government - Whatever American government still exists its right here and stays as a Democracy ruled by the Military. Alaska - The Government of the state of Alaska decided they did not want to associate themselves with the U.S. anymore and founded themselves their own country. Hawaii - What was left of the Hawiian Monarchy now rules over the island state once more."
 mollissea_misc.2.a:0 "Noted."
 mollissea_misc.3.t:0 "An Odd Report..."
 mollissea_misc.3.d:0 "The M.S.A. has reported a gang of outlaws led by a man with a dutch sounding name the agents were cutoff and are presumed dead what should we do?"
 mollissea_misc.3.a:0 "Investagate"
 mollissea_misc.3.b:0 "Leave them alone"
 mollissea_misc.4.t:0 "The Follow up"
 mollissea_misc.4.d:0 "after staking out the camp where the outlaws were for several days now we managed to capture a Mr. Morgan who seemed to be riddled with the deadly disease T.B. and he is recieveing medical treatment however the facility where he is being held is reporting multple breakins..."
 mollissea_misc.4.a:0 "The Facility was found dead the next morning..."
