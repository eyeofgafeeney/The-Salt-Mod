l_english:
 MOS_start:0 "The Unpopular President"
 MOS_start_desc:0 "Noava as a president has delayed elections and has gone against the constitution at many turns what will be his future?"
 MOS_economy_1:0 "A New Economy"
 MOS_economy_1_desc:0 "to start off our new economy we will build a hyderoelectric dam within our great nation!"
 MOS_political_2:0 "Where do we go next?"
 MOS_political_2_desc:0 "Mollissea stands at a crossroads where do we go next as a nation?"
 MOS_political_1:0 "The TPC Coup"
 MOS_political_1_desc:0 "The TPC shall coup the noava led government in order to bring a free Mollissea!"
 MOS_army_1:0 "A New Military"
 MOS_army_1_desc:0 "A new country with a new military lets try to reform to make it the greatest ever seen!"
 MOS_sec_1:0 "The Mollissea Security Agency"
 MOS_cou_1:0 "The Council"
 MOS_sec_1_desc:0 ""Director your plan is ready" The M.S.A. or Mollissea Security Agency is the organization within Mollissea governing all defense be it internal or external and is the nations intelegence agency and it has great poltical influence."
 MOS_cou_1_desc:0 ""Do you hear the people sing?" The Council is the main execuitive and legislative body in Mollissea lead by a chariman its only challenger in political influence is the M.S.A."
 MOS_sec_2:0 "Pro-MSA Propaganda"
 MOS_sec_2_desc:0 "Propaganda as a tool has been used for decades as a way to sway the people if we use it ourselves it will further our cause."
 MOS_sec_3:0 "An ounce of force"
 MOS_sec_3_desc:0 "If we start employing even an ounce of force we can sway the council to provide us with more power we need in order to enact our plans."
 MOS_sec_6:0 "The Call"
 MOS_sec_6_desc:0 "The Council is corrupt it is now time for us to remove them by force if needed."
 MOS_sec_4:0 "A pound of force"
 MOS_sec_5:0 "False flag attacks"
 MOS_sec_5_desc:0 "We will commit false flag attacks acting as if they were from American nationalists in order to rile up our people."
 MOS_sec_4_desc:0 "We will need to up our manpower for what is coming next so we will up recruitment efforts."
 MOS_cou_3:0 "For a free Mollissea!"
 MOS_cou_3_desc:0 "Weather we would like to admit it or not the MSA holds great politcal influence within the country we must use our own propaganda in order to quell them."
 MOS_cou_5:0 "Democratic Propoganda"
 MOS_cou_5_desc:0 "Using our own counter-propoganda against the MSA will hopefully allow us to gain even more influence ensureing our own independence from them."
 MOS_cou_2:0 "Criminal Proceedings"
 MOS_cou_2_desc:0 "The MSA have done some henious acts in the intrest of "National Security" we will expose these acts and start criminal proceedings."
 MOS_cou_4:0 "De-classified documents"
 MOS_cou_4_desc:0 "by de-classifing multiple MSA documents the people will learn what they have done."
 MOS_cou_6:0 "The Mollissea City Riots"
 MOS_cou_6_desc:0 ""Do you hear the people sing?" The people riot because of what they've learned and the people will be heard."
 mos_tor_1:0 "Election Planning"
 mos_tor_1_desc:0 "The leader of the TPC Torch themselves has decided to become president so they may supervise this free Mollissea and ensure it grows forevermore."
 mos_pres_1:0 "The President Triumphent"
 MOS_pres_7:0 "Martial Law"
 MOS_tor7:0 "Presidental Elections"
 MOS_tor_3:0 "Democratic reforms"
 MOS_tor_3_desc:0 "Noava did not help our demoracy and in fact he hurted it so Torch will preform reforms in order to restore democracy to Mollissea."
 MOS_tor_2:0 "Constitutational Reforms"
 MOS_tor_2_desc:0 "There is more to be done in making sure another "Noava" does not happen again. So we will start some broad reforms."
 MOS_tor_6:0 "The Election Council"
 MOS_tor_6_desc:0 "The idea of a council was not all that bad... so we will make one who's only job is to keep our elections free and fair with the ability of Torch to moderate them as well as the election council having the ability to moderate Torch as well."
 MOS_tor_4:0 "The Extremeism act"
 MOS_tor_4_desc:0 "extremeism is a bad thing for our lands even though we are a coalition communists fascists... they need to be stopped and banned from running."
 MOS_tor_5:0 "Further crackdown"
 MOS_tor_5_desc:0 "Despite our banning of extremeist ideologies they still run rampent so we will use MP support and propaganda to defeat them once and for all."
 mollissea_torch_1:0 "Torch wins?"
 mollissea_torch_1_desc:0 "With the other canidates deadlocked Torch was the only sensible choice left in the end."
 mollissea_desmon_1:0 "The Founder once more"
 mollissea_desmon_1_desc:0 "The founder of Mollissea has gotten in power once more will he make it great this time around?"
 FUR_focus_1:0 "Puppet"
 FUR_focus_1_desc:0 "ideally you wont see this but you for some fucking reason decided to play this country"
 mollissea_torch_p_2_1:0 "Leader of the people"
 mollissea_torch_p_1_1:0 "Leading from above"
 mollissea_torch_f_1:0 "Extinguishing the fires"
 mollissea_torch_f_1_desc:0 ""
 mollissea_torch_2:0 "A full rewrite"
 mollissea_e_1:0 "The Failing Economy"
 mollissea_e_1_desc:0 "By mixing the aspects of a planned economy and corporatism we will manage the best of both worlds but lets not let the corporations bog us down..."
 mollissea_p_2:0 "The Poltical Front"
 mollissea_p_2_desc:0 "The Poltical Front is as needed as the military and the economy as both of those fall flat without the other and it is our job to manage them both."
 mollissea_w_1:0 "The Republic's military"
 mollissea_w_1_desc:0 "The Republic's military is not in the greatest state... it did not progress much since its formation and making a new military is quite the hard task indeed."
 mollissea_e_2:0 "The Gold Standard."
 mollissea_e_2_desc:0 "Inflation out of control and interest rates are not good by binding our currency to our gold reserves we can hopefully curb these aspects."
 mollissea_e_3:0 "Expansion, Expansion, and.... Expansion."
 mollissea_e_3_desc:0 "Another part of keeping a economy stable is growing it so lets take some steps in order to actually make our economy exist."
 mollissea_e_11:0 "Stage 2"
 mollissea_e_11_desc:0 ""
 mollissea_e_12:0 "Prosperity Forever"
 mollissea_torch_2_desc:0 "Whilst some reforms have been made, the constitution, in its current state, simply does not reflect the country's current or future needs, so we must rewrite it to ensure our freedoms remain and we live 1000 years more."
